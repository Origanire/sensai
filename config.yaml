# ollama pull <model>
model: llama3.2

ollama_url: http://localhost:11434

max_tokens: 1024

# 0 = très déterministe / répétitif, 1 = très créatif / aléatoire
temperature: 0.7

# Agent chat Twitch
twitch_channel: kevinaigre
twitch_trigger: "@sensai"
# Formulations acceptees pour enregistrer un fait dans le profil du viewer.
# La plus longue doit venir en premier.
twitch_remember_commands:
  - "retiens que"
  - "retiens"

# Texte affiche au viewer quand un fait a ete enregistre.
twitch_ack_message: "c'est noté."

# Taille max de l'historique envoyé au modèle, en tokens.
# Ollama fait tourner llama3.2 avec 4096 tokens de contexte : il faut
# laisser de la place pour la réponse (voir max_tokens).
history_token_budget: 2500
