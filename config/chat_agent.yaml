# Configuration de l'agent chat Twitch.
# Les réglages globaux (modèle, URL Ollama...) restent dans config.yaml.

# Chaîne Twitch à écouter.
channel: kevinaigre

# Mention à laquelle Sensai répond dans le chat.
trigger: "@sensai"

# Préfixe des commandes (!remember, !moment, !search).
command_prefix: "!"

# Commande qui enregistre un fait dans le profil d'un viewer.
# Usage : !remember <pseudo> <fait>
remember_command: "remember"

# Réponse quand !remember a bien enregistré le fait.
fact_saved_message: "noté."

# Réponse quand !remember vise un viewer qui n'a jamais écrit dans le chat.
viewer_not_found_message: "je ne connais pas encore ce viewer."

# Commande qui ajoute un moment fort au compte-rendu du stream
# (section "moments_forts" de stream_report.json).
# Usage : !moment <description>
moment_command: "moment"

# Réponse quand !moment a bien ajouté le moment fort.
moment_saved_message: "moment fort noté."

# Réponse quand !moment est tapé sans description.
moment_usage_message: "usage : !moment <description>"

# Commande qui pose une question à l'agent Internet (recherche web).
# Ouverte à tous, limitée par internet_agent.cooldown_seconds (config.yaml).
# Usage : !search <question>
search_command: "search"

# Réponse quand !search est tapé sans question.
search_usage_message: "usage : !search <question>"

# Taille max de l'historique envoyé au modèle, en tokens.
# Ollama fait tourner llama3.2 avec 4096 tokens de contexte : il faut
# laisser de la place pour la réponse (voir max_tokens dans config.yaml).
history_token_budget: 2500

